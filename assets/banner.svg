    <circle class="b2" cx="1000" cy="300" r="300" fill="url(#blob2)"/>
    <rect class="scan" width="1200" height="2" fill="#22d3ee" opacity=".08"/>
    <line x1="930" y1="170" x2="820" y2="78" class="e"/><line x1="930" y1="170" x2="820" y2="78" class="flow" style="animation-delay:-0.00s"/><line x1="930" y1="170" x2="1050" y2="70" class="e"/><line x1="930" y1="170" x2="1050" y2="70" class="flow" style="animation-delay:-0.37s"/><line x1="930" y1="170" x2="1110" y2="175" class="e"/><line x1="930" y1="170" x2="1110" y2="175" class="flow" style="animation-delay:-0.74s"/><line x1="930" y1="170" x2="1040" y2="275" class="e"/><line x1="930" y1="170" x2="1040" y2="275" class="flow" style="animation-delay:-1.11s"/><line x1="930" y1="170" x2="840" y2="272" class="e"/><line x1="930" y1="170" x2="840" y2="272" class="flow" style="animation-delay:-1.48s"/><line x1="930" y1="170" x2="760" y2="178" class="e"/><line x1="930" y1="170" x2="760" y2="178" class="flow" style="animation-delay:-1.85s"/><line x1="820" y1="78" x2="1050" y2="70" class="e2"/><line x1="1050" y1="70" x2="1110" y2="175" class="e2"/><line x1="1110" y1="175" x2="1040" y2="275" class="e2"/><line x1="1040" y1="275" x2="840" y2="272" class="e2"/><line x1="840" y1="272" x2="760" y2="178" class="e2"/><line x1="760" y1="178" x2="820" y2="78" class="e2"/>
